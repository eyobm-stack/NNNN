<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock - Multiple Time Zones</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Courier New', monospace;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    border: 1px solid rgba(255, 255, 255, 0.18);
    max-width: 900px;
    width: 100%;
}

.title {
    text-align: center;
    color: white;
    font-size: 32px;
    margin-bottom: 40px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
}

.clocks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
    margin-bottom: 30px;
}

.clock-card {
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
}

.clock-card:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.4);
    transform: translateY(-5px);
}

.timezone-label {
    color: #b0e0ff;
    font-size: 14px;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.time-display {
    color: #00ff88;
    font-size: 48px;
    font-weight: bold;
    margin-bottom: 8px;
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    font-family: 'Arial', monospace;
    letter-spacing: 2px;
}

.date-display {
    color: #b0e0ff;
    font-size: 12px;
    opacity: 0.9;
}

.add-timezone {
    display: flex;
    gap: 10px;
    margin-top: 30px;
    padding-top: 30px;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
}

.add-timezone input,
.add-timezone button {
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Courier New', monospace;
    cursor: pointer;
    transition: all 0.3s ease;
}

.add-timezone input {
    flex: 1;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.3);
}

.add-timezone input::placeholder {
    color: rgba(255, 255, 255, 0.5);
}

.add-timezone input:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.5);
}

.add-timezone button {
    background: linear-gradient(135deg, #00ff88 0%, #00cc6f 100%);
    color: #333;
    font-weight: bold;
    min-width: 120px;
}

.add-timezone button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
}

.remove-btn {
    margin-top: 10px;
    padding: 8px 12px;
    background: rgba(255, 68, 68, 0.3);
    color: #ff4444;
    border: 1px solid #ff4444;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.3s ease;
}

.remove-btn:hover {
    background: rgba(255, 68, 68, 0.5);
    transform: scale(1.05);
}

.preset-timezones {
    text-align: center;
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    margin-top: 15px;
    line-height: 1.6;
}

.preset-timezones strong {
    color: #00ff88;
}
</style>
</head>

<body>

<div class="container">
    <div class="title">🕐 Digital Clock</div>
    
    <div class="clocks-grid" id="clocksContainer">
        <!-- Clocks will be added here by JavaScript -->
    </div>

    <div class="add-timezone">
        <input type="text" id="timezoneInput" placeholder="Enter timezone (e.g., America/New_York, Asia/Tokyo)">
        <button onclick="addTimezone()">+ Add</button>
    </div>

    <div class="preset-timezones">
        <strong>Popular timezones:</strong><br>
        America/New_York | America/Los_Angeles | Europe/London | Europe/Paris | Asia/Tokyo | Asia/Dubai | Australia/Sydney
    </div>
</div>

<script>
// Default timezones
const defaultTimezones = [
    'America/New_York',
    'Europe/London',
    'Asia/Tokyo',
    'Australia/Sydney'
];

let customTimezones = JSON.parse(localStorage.getItem('customTimezones')) || [];

function initClocks() {
    const container = document.getElementById('clocksContainer');
    container.innerHTML = '';
    
    const allTimezones = [...defaultTimezones, ...customTimezones];
    
    allTimezones.forEach((tz, index) => {
        const card = document.createElement('div');
        card.className = 'clock-card';
        card.innerHTML = `
            <div class="timezone-label">${tz}</div>
            <div class="time-display" data-tz="${tz}">--:--:--</div>
            <div class="date-display" data-tz-date="${tz}">--/--/----</div>
            ${customTimezones.includes(tz) ? `<button class="remove-btn" onclick="removeTimezone('${tz}')">Remove</button>` : ''}
        `;
        container.appendChild(card);
    });
    
    updateClocks();
}

function updateClocks() {
    const allTimezones = [...defaultTimezones, ...customTimezones];
    
    allTimezones.forEach(tz => {
        try {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: tz,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            
            const dateFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: tz,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            
            const timeElement = document.querySelector(`[data-tz="${tz}"]`);
            const dateElement = document.querySelector(`[data-tz-date="${tz}"]`);
            
            if (timeElement) {
                timeElement.textContent = formatter.format(now);
            }
            if (dateElement) {
                dateElement.textContent = dateFormatter.format(now);
            }
        } catch (e) {
            console.error(`Invalid timezone: ${tz}`);
        }
    });
}

function addTimezone() {
    const input = document.getElementById('timezoneInput');
    const tz = input.value.trim();
    
    if (!tz) {
        alert('Please enter a timezone');
        return;
    }
    
    // Validate timezone
    try {
        const testDate = new Date();
        new Intl.DateTimeFormat('en-US', { timeZone: tz });
    } catch (e) {
        alert(`Invalid timezone: ${tz}\nPlease use format like: America/New_York`);
        return;
    }
    
    if (!customTimezones.includes(tz) && !defaultTimezones.includes(tz)) {
        customTimezones.push(tz);
        localStorage.setItem('customTimezones', JSON.stringify(customTimezones));
        input.value = '';
        initClocks();
    } else {
        alert('This timezone is already added');
    }
}

function removeTimezone(tz) {
    customTimezones = customTimezones.filter(t => t !== tz);
    localStorage.setItem('customTimezones', JSON.stringify(customTimezones));
    initClocks();
}

// Initialize and update every second
initClocks();
setInterval(updateClocks, 1000);

// Allow Enter key to add timezone
document.getElementById('timezoneInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') addTimezone();
});
</script>

</body>
</html>
